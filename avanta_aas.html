<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GBC Avanta AAS 3D</title>
<style>
:root{--bg:#eef1f4;--ink:#1c2630;--card:#fff;--line:#c9d1d9;--acc:#1b6ca8;--hot:#e8662a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--ink:#e6edf3;--card:#1a232c;--line:#33414d;--acc:#5aa9e6}}
:root[data-theme="dark"]{--bg:#10171d;--ink:#e6edf3;--card:#1a232c;--line:#33414d;--acc:#5aa9e6}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#cv{flex:1;min-height:0;position:relative;touch-action:none}
#cv canvas{display:block;width:100%;height:100%}
#hud{position:absolute;left:10px;top:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
#hud b{font-size:18px;color:var(--hot)}
#panel{background:var(--card);border-top:1px solid var(--line);padding:10px;max-height:42%;overflow:auto}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#info{font-size:13px;min-height:3.6em}
</style></head><body>
<div id="cv"><div id="hud">Absorbansi Ca: <b id="abs">0.000</b><div id="lampinfo" style="font-size:12px"></div></div></div>
<div id="panel">
<div class="row" id="ctl">
<button id="run" class="on">Jalan</button>
<button id="xray">Tembus pandang</button>
<button id="spin">Putar otomatis</button>
<button id="lidb">Buka tempat lampu</button>
</div>
<div class="row"><button id="s6">6 slot</button><button id="s8" class="on">8 slot</button><button id="nx">Lampu berikutnya</button></div>
<div class="row" id="modes"></div>
<div class="row" id="parts"></div>
<div id="info">Seret untuk memutar 360°, cubit untuk zoom. Pilih bagian untuk menyorot.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const host=$('cv');
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,100);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
host.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x556677,.9));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,6);scene.add(dl);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.2},o));
const parts={};
function add(key,name,desc,mesh){Object.assign(mesh.userData,{key});parts[key]={name,desc,mesh,base:[]};
  mesh.traverse(m=>{if(m.material)parts[key].base.push([m,m.material.emissive?m.material.emissive.getHex():0])});scene.add(mesh);return mesh}

// ===== Bodi bergaya GBC SavantAA =====
const shellMat=M(0xf2f3f4,{transparent:true,opacity:1,metalness:.05,roughness:.35});
const bandMat=M(0x3a3a3f,{transparent:true,opacity:1,roughness:.6});
const dark=M(0x14161a,{roughness:.85});
const body=new THREE.Group();
const bxm=(w,h,d,x,y,z,m)=>{const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);body.add(q);return q};
bxm(13.6,.25,4.4,.7,.125,0,dark);
const dome=(w,x,par)=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,w,24,1,false,0,Math.PI),shellMat);c.rotation.z=Math.PI/2;c.scale.set(1,1,3.8);c.position.set(x,0,0);par.add(c);return c};
const upper=(w,x)=>{bxm(w,1.2,4.6,x,2.65,0,shellMat);dome(w,x,body).position.y=3.25};
[[8.7,-2.15],[3.9,5.55]].forEach(([w,x])=>{bxm(w,1.1,4.6,x,.8,0,shellMat);bxm(w,.7,4.64,x,1.7,0,bandMat)});
upper(3.9,5.55);upper(.8,-6.1);upper(5.7,-.65);
bxm(2.2,1.2,.1,-4.6,2.65,2.25,shellMat);bxm(2.2,1.2,.1,-4.6,2.65,-2.25,shellMat);
const lid=new THREE.Group();lid.position.set(-4.6,3.25,-2.3);const ld=dome(2.2,0,lid);ld.position.set(0,0,2.3);body.add(lid);
// kompartemen sampel (terbuka di depan)
bxm(1.4,3.0,.2,2.9,1.75,-2.2,dark);bxm(.1,3.0,4.4,2.25,1.75,0,dark);bxm(.1,3.0,4.4,3.55,1.75,0,dark);bxm(1.4,.1,4.4,2.9,3.25,0,dark);bxm(1.4,.1,4.4,2.9,.3,0,dark);
// label, tombol, lampu indikator
const lab=(t,x)=>{const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#fff';g.font='bold 78px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,68);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.6,.65),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));p.position.set(x,1.7,2.33);body.add(p)};
lab('SavantAA',-4.6);lab('GBC',5.9);
[[1.2,1.0,0x1f8a8a],[1.2,.6,0x1f8a8a],[4.6,.8,0xd9b44a],[5.4,.8,0x2e7d32],[6.1,.8,0x1565c0]].forEach(([x,y,c])=>{const k=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.08,20),M(c));k.rotation.x=Math.PI/2;k.position.set(x,y,2.33);body.add(k)});
add('body','Rumah alat','Bodi putih bergaya SavantAA. Kompartemen hitam di tengah terbuka di depan untuk burner dan ruang semprot, sedangkan optik berada tertutup di kiri dan kanan. Aktifkan "Tembus pandang" untuk melihat bagian dalamnya.',body);

// torret lampu (6 atau 8 slot)
const LAMPS=['Ca','Mg','Na','K','Cu','Zn','Fe','Pb'];
const lamp=new THREE.Group();lamp.position.set(-4.6,2.15,0);
const turret=new THREE.Group();lamp.add(turret);
let nSlot=8,act=0,turT=0;
add('lamp','Torret lampu katoda berongga','Piringan putar berisi 6 atau 8 lampu. Torret berputar otomatis membawa lampu terpilih ke jalur berkas cahaya. Lampu Ca (422,7 nm) ada di slot 1, lampu lain hanya contoh logam umum.',lamp);
function lampInfo(){const i=((act%nSlot)+nSlot)%nSlot;$('lampinfo').textContent='Lampu aktif: '+LAMPS[i]+' (slot '+(i+1)+'/'+nSlot+')'}
function buildTurret(){
 while(turret.children.length)turret.remove(turret.children[0]);
 const R=.5,r=nSlot==8?.16:.2;
 const disc=new THREE.Mesh(new THREE.CylinderGeometry(R+.3,R+.3,.08,40),M(0x9aa7b2));disc.rotation.z=Math.PI/2;disc.position.x=-.75;turret.add(disc);
 for(let i=0;i<nSlot;i++){const a=i*2*Math.PI/nSlot,ca=i==0,g=new THREE.Group();
  const lb=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1.1,20),M(ca?0xcfd8de:0x8895a0));lb.rotation.z=Math.PI/2;lb.position.x=-.15;
  const lw=new THREE.Mesh(new THREE.CylinderGeometry(r*.65,r*.65,.1,20),M(ca?0x9fd3ff:0x6f8696,{transparent:true,opacity:.85}));lw.rotation.z=Math.PI/2;lw.position.x=.45;
  g.add(lb,lw);g.position.set(0,R*Math.cos(a),R*Math.sin(a));turret.add(g)}
 act=0;turT=0;turret.rotation.x=0;lampInfo();
 parts.lamp.base=[];lamp.traverse(m=>{if(m.material)parts.lamp.base.push([m,m.material.emissive?m.material.emissive.getHex():0])});
}
buildTurret();
$('s6').onclick=()=>{nSlot=6;$('s6').classList.add('on');$('s8').classList.remove('on');buildTurret()};
$('s8').onclick=()=>{nSlot=8;$('s8').classList.add('on');$('s6').classList.remove('on');buildTurret()};
$('nx').onclick=()=>{act++;turT=-act*2*Math.PI/nSlot;lampInfo()};


// burner + ruang semprot (di dalam kompartemen)
const burner=new THREE.Group();
const bh=new THREE.Mesh(new THREE.BoxGeometry(1.2,.3,.25),M(0x6d7883));bh.position.y=2.15;
const nk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,.5,16),M(0x8a96a1));nk.position.y=1.85;
const sc=new THREE.Mesh(new THREE.CylinderGeometry(.5,.4,1.3,24),M(0xcfd8de,{transparent:true,opacity:.7}));sc.position.y=1.0;
const neb=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,1.5,16),M(0x2f7fb8));neb.rotation.x=Math.PI/2;neb.position.set(0,.9,1.0);
const tube=(pts,c)=>new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p))),24,.04,8),M(c));
burner.add(bh,nk,sc,neb,tube([[.1,1.2,.3],[.5,.9,1.4],[.2,.5,2.0],[-.1,.4,2.2]],0xd32f2f),tube([[-.1,1.2,.3],[-.5,1.0,1.4],[-.2,.55,2.0],[.1,.45,2.2]],0x1565c0));
burner.position.x=2.9;
add('burner','Burner & ruang semprot','Sampel dihisap kapiler, dikabutkan oleh nebulizer bersama oksidan, lalu diselaraskan di ruang semprot. Kabut halus naik ke burner. Nyala N2O-asetilen dipakai untuk Ca agar fosfat/sulfat terurai. Selang merah dan biru adalah jalur gas.',burner);
const g1=new THREE.ConeGeometry(.35,1.2,20,1,true);g1.scale(1.6,1,.7);
const g2=new THREE.ConeGeometry(.16,.7,16,1,true);g2.scale(1.6,1,.7);
const flame=new THREE.Mesh(g1,new THREE.MeshBasicMaterial({color:0xff8a3d,transparent:true,opacity:.75,side:2}));flame.position.set(2.9,2.9,0);scene.add(flame);
const core=new THREE.Mesh(g2,new THREE.MeshBasicMaterial({color:0xfff0a8,transparent:true,opacity:.9,side:2}));core.position.set(2.9,2.65,0);scene.add(core);
parts.burner.flame=[flame,core];

// monokromator
const mono=new THREE.Group();
const mb=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.6,2.2),M(0x7e8c99,{transparent:true,opacity:.55}));
const grating=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.12,32),M(0xd9b44a,{metalness:.8,roughness:.2}));grating.rotation.x=Math.PI/2;grating.position.set(.2,0,0);
const sl=new THREE.Mesh(new THREE.BoxGeometry(.06,.9,.4),M(0x222));sl.position.set(-.8,0,0);
mono.add(mb,grating,sl);mono.position.set(4.9,2.65,0);
add('mono','Monokromator','Celah dan kisi difraksi memisahkan 422,7 nm dari cahaya nyala dan garis lain. Lebar celah menentukan resolusi dan intensitas.',mono);

// PMT
const pmt=new THREE.Group();
const pb=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,1.2,24),M(0x37474f));pb.rotation.z=Math.PI/2;
const pf=new THREE.Mesh(new THREE.CircleGeometry(.38,24),M(0x90caf9,{side:2}));pf.rotation.y=-Math.PI/2;pf.position.x=-.61;
pmt.add(pb,pf);pmt.position.set(6.6,2.65,0);
add('pmt','Detektor PMT','Tabung pengganda foton mengubah foton yang lolos menjadi arus listrik. Sinyal dibandingkan dengan intensitas tanpa sampel untuk mendapat absorbansi.',pmt);

// beam
const bx0=-3.7,bx1=6.0,by=2.65;
const beam=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,bx1-bx0,8),new THREE.MeshBasicMaterial({color:0x8f6bff,transparent:true,opacity:.35}));
beam.rotation.z=Math.PI/2;beam.position.set((bx0+bx1)/2,by,0);scene.add(beam);
const ph=[];const pm=new THREE.MeshBasicMaterial({color:0xc9b6ff});
for(let i=0;i<26;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),pm.clone());s.userData.t=i/26;scene.add(s);ph.push(s)}

// ground labels via dom chips
Object.keys(parts).forEach(k=>{const b=document.createElement('button');b.textContent=parts[k].name.split(' (')[0];b.onclick=()=>pick(k,b);b.dataset.k=k;$('parts').appendChild(b)});
let sel=null;
function pick(k,btn){sel=sel===k?null:k;document.querySelectorAll('#parts button').forEach(b=>b.classList.toggle('on',b.dataset.k===sel));
  $('info').innerHTML=sel?'<b>'+parts[k].name+'</b><br>'+parts[k].desc:'Seret untuk memutar 360°, cubit untuk zoom.';
  Object.entries(parts).forEach(([kk,p])=>p.base.forEach(([m,h])=>{if(m.material.emissive)m.material.emissive.setHex(kk===sel?0x2a5f9a:h)}))}

// modes
const modes=[['Ca saja',1,'Ca bebas diatomisasi penuh. Sinyal 100%.'],
['+ PO4 & SO4',.55,'PO4 dan SO4 membentuk senyawa Ca tahan panas (Ca3(PO4)2, CaSO4) yang tidak teratomisasi sempurna. Sinyal turun.'],
['+ PO4 & SO4 + La/Sr',.97,'La atau Sr mengikat fosfat/sulfat lebih dulu sehingga Ca bebas. Sinyal pulih.'],
['+ PO4 & SO4 + EDTA',.93,'EDTA mengkelat Ca sehingga tidak berikatan dengan PO4/SO4 dan mudah terurai di nyala.']];
let mi=0;const A0=.42;
modes.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m[0];b.onclick=()=>{mi=i;document.querySelectorAll('#modes button').forEach((x,j)=>x.classList.toggle('on',j===i));$('info').innerHTML='<b>'+m[0]+'</b><br>'+m[2]};if(!i)b.classList.add('on');$('modes').appendChild(b)});

let run=true,spin=false,lidT=0,lidA=0;
$('lidb').onclick=e=>{lidT=lidT?0:1;e.target.classList.toggle('on',!!lidT);e.target.textContent=lidT?'Tutup tempat lampu':'Buka tempat lampu';if(lidT)$('info').innerHTML='<b>Tempat lampu terbuka</b><br>Torret lampu katoda berongga terlihat. Lampu diganti dengan mencabutnya dari soket, lalu menyalakan dan memanaskannya (warm-up) sebelum analisis.'}
$('run').onclick=e=>{run=!run;e.target.classList.toggle('on',run)};
$('xray').onclick=e=>{const on=e.target.classList.toggle('on');[shellMat,bandMat].forEach(m=>m.opacity=on?.15:1)};
$('spin').onclick=e=>{spin=e.target.classList.toggle('on')};

// orbit
let th=.55,ph_=1.3,rad=19;const tgt=new THREE.Vector3(.5,1.6,0);
let pts=new Map(),pd=0;
const el=ren.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
  if(pts.size===1){th-=(e.clientX-o[0])*.008;ph_=Math.min(3,Math.max(.2,ph_-(e.clientY-o[1])*.008))}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const a=[...pts.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)rad=Math.min(32,Math.max(6,rad*pd/d));pd=d}});
const up=e=>{pts.delete(e.pointerId);pd=0};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(32,Math.max(6,rad*(1+e.deltaY*.001)))},{passive:false});

function size(){const w=host.clientWidth,h=host.clientHeight;ren.setSize(w,h);ren.setPixelRatio(Math.min(devicePixelRatio,2));cam.aspect=w/h;cam.updateProjectionMatrix();rad=Math.max(rad,w<500?16:rad)}
addEventListener('resize',size);size();

let t=0;
function loop(){requestAnimationFrame(loop);t+=.016;
  if(spin)th+=.004;
  cam.position.set(tgt.x+rad*Math.sin(ph_)*Math.sin(th),tgt.y+rad*Math.cos(ph_),tgt.z+rad*Math.sin(ph_)*Math.cos(th));cam.lookAt(tgt);
  const trans=Math.pow(10,-A0*modes[mi][1]);
  $('abs').textContent=!run?'0.000':(((act%nSlot)+nSlot)%nSlot==0?(A0*modes[mi][1]).toFixed(3):'—');turret.rotation.x+=(turT-turret.rotation.x)*.1;
  parts.burner.flame.forEach((f,i)=>{f.visible=run;f.scale.set(1+.08*Math.sin(t*18+i),1+.12*Math.sin(t*23+i*2),1+.08*Math.cos(t*17))});
  grating.rotation.z=run?Math.sin(t*.8)*.08:0;
  ph.forEach(s=>{s.visible=run;if(!run)return;s.userData.t=(s.userData.t+.006)%1;const x=bx0+s.userData.t*(bx1-bx0);s.position.set(x,by,(Math.random()-.5)*.02);
    const post=x>2.4;s.material.opacity=1;s.scale.setScalar(post?.5+.7*trans:1.1);s.visible=!post||Math.random()<trans+.1});
  lidA+=(lidT-lidA)*.1;lid.rotation.x=-lidA*1.75;
  ren.render(scene,cam)}
loop();
</script></body></html>
